<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>B3 Tested Beam — 3D & AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
  <style>
    html,body{height:100%;margin:0;background:#f3f5f7;font-family:Arial,sans-serif;color:#17202a}
    main{height:100%;display:flex;flex-direction:column}
    header{padding:12px 16px;background:#fff;box-shadow:0 1px 5px #0002;z-index:2}
    h1{font-size:18px;margin:0}.hint{font-size:12px;color:#5d6d7e;margin-top:4px}
    model-viewer{width:100%;flex:1;background:linear-gradient(#eef2f5,#dce4e9)}
    button[slot="ar-button"]{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);border:0;border-radius:24px;padding:13px 22px;background:#0057b8;color:#fff;font-size:16px;font-weight:700;box-shadow:0 3px 12px #0004}
  </style>
</head>
<body><main>
  <header><h1>B3 Tested Beam</h1><div class="hint">Drag to rotate · Pinch to zoom · Tap “View in your space” for Android AR</div></header>
  <model-viewer src="B3_android.glb" alt="3D scan of tested tapered steel beam B3" camera-controls touch-action="pan-y" auto-rotate shadow-intensity="1" exposure="1" ar ar-modes="scene-viewer webxr quick-look">
    <button slot="ar-button">View in your space</button>
  </model-viewer>
</main></body></html>
